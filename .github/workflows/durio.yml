# dur.io (stage 7, D6): the Windows client is built only here, from a tag, never on a
# developer machine. A release = this repository at the tag + for-web at the commit
# pinned in for-web.lock.json. Releases are drafts with SHA256SUMS; publish by hand.
name: dur.io desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    # for-web `vite build --mode desktop` at the pinned commit, checked by sync-web
    name: for-web desktop build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: for-desktop

      - name: Read the for-web pin
        id: pin
        run: |
          echo "repository=$(jq -r .repository for-desktop/for-web.lock.json | sed -E 's#^https://github.com/##; s#\.git$##')" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit for-desktop/for-web.lock.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: for-web
          submodules: recursive

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          working_directory: for-web

      - name: No Sentry DSN in our builds
        run: test -z "${VITE_SENTRY_DSN:-}"

      - name: Build for-web for the desktop app
        working-directory: for-web
        run: |
          mise install:frozen
          mise assets:fallback
          mise build:deps
          mise build:desktop

      - name: Copy into web/ (pin, clean tree, CSP)
        working-directory: for-desktop
        run: node scripts/sync-web.mjs --from ../for-web --strict

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: for-desktop/web/
          include-hidden-files: true
          if-no-files-found: error

  windows:
    name: Windows (Squirrel)
    needs: web
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # the installer and the nupkg take their version from package.json, the release its tag
      - name: The tag is the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME, package.json $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Package and run the Playwright tests (no backend)
        run: |
          pnpm package
          pnpm test:e2e

      - name: Make the installer (unsigned, O11')
        env:
          DURIO_SIGN: "0"
        run: pnpm make --platform win32

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $dir = "out/make/squirrel.windows/x64"
          Copy-Item web/durio-web.json $dir/
          Get-ChildItem $dir -File |
            Where-Object Name -ne "SHA256SUMS" |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii "$dir/SHA256SUMS"
          Get-Content "$dir/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/make/squirrel.windows/x64/
          if-no-files-found: error

  linux:
    # Linux is only kept building (O11, Q66); it is not tested or released
    name: Linux (build only)
    needs: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm make --platform linux --targets @electron-forge/maker-zip

  e2e-live:
    # WEB-08 / D7: the E2EE scenarios (tests/e2e/live) against the stoat-crypto testkit
    # stack — our backend built from source, the scripted peer as the other device. Docker
    # runs only on the Linux runners: the app runs under xvfb, safeStorage gets a
    # gnome-keyring (the app refuses the plain-text store). Not a gate for releases yet.
    name: E2E with the testkit backend
    needs: web
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TESTKIT_PUBLIC_PORT: "14443"
      CARGO_BUILD_JOBS: "4"

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      # the workspace layout testkit-backend.sh expects: stoatchat/ next to stoat-crypto/
      - uses: actions/checkout@v4
        with:
          path: for-desktop
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/durio-chat
          ref: ${{ vars.DURIO_CHAT_REF || 'main' }}
          path: stoatchat
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/durio-crypt
          ref: ${{ vars.DURIO_CRYPT_REF || 'main' }}
          path: stoat-crypto

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: for-desktop/web

      - name: Backend builder image (durio-rust-dev:local)
        run: |
          docker build -t durio-rust-dev:local - <<'EOF'
          FROM rust:1.92.0-slim-trixie
          RUN apt-get update && apt-get install -y --no-install-recommends \
              make pkg-config libdav1d-dev libssl-dev ca-certificates curl \
              && rm -rf /var/lib/apt/lists/*
          EOF

      - name: Infra (as tools/rust-dev/test-env.sh up)
        run: |
          docker network create durio-test
          docker run -d --name durio-test-redis --network durio-test redis:7-alpine
          docker run -d --name durio-test-rabbit --network durio-test \
            -e RABBITMQ_DEFAULT_USER=rabbituser -e RABBITMQ_DEFAULT_PASS=rabbitpass rabbitmq:4-alpine
          docker run -d --name durio-test-mongo --network durio-test mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 60); do
            docker exec durio-test-mongo mongosh --quiet --eval \
              'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "durio-test-mongo:27017"}]}).ok }' \
              2>/dev/null | grep -q 1 && break
            sleep 1
          done
          for i in $(seq 60); do
            docker exec -u rabbitmq durio-test-rabbit rabbitmq-diagnostics -q check_running >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec -u rabbitmq durio-test-rabbit rabbitmqctl eval 'rabbit_exchange:declare(rabbit_misc:r(<<"/">>, exchange,
            <<"revolt.default">>), topic, true, false, false, [], <<"rabbituser">>).'

      - name: Testkit stack (debug backend, server 2, TLS proxy, peer)
        run: stoat-crypto/scripts/testkit-backend.sh up

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: for-desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: for-desktop/pnpm-lock.yaml

      - name: Display and keyring for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11 gnome-keyring
          # Ubuntu 24.04 blocks the user namespaces of Chromium's sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Package and run all Playwright tests (live ones included)
        working-directory: for-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm package
          # Chromium picks the keyring by desktop: with none set safeStorage has no keyring
          # and the app refuses to keep keys ("OS encryption is not available")
          dbus-run-session -- sh -c '
            eval "$(echo -n durio | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL XDG_CURRENT_DESKTOP=GNOME
            xvfb-run -a pnpm test:e2e'

      - name: Server logs
        if: failure()
        run: |
          for s in delta bonfire autumn pushd delta2 bonfire2 mongo2 rabbit2 proxy; do
            echo "::group::$s"; docker logs --tail 200 durio-test-$s 2>&1 || echo "(no container durio-test-$s)"; echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-live-results
          path: for-desktop/test-results/
          if-no-files-found: ignore

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Check the sums and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "dur.io $GITHUB_REF_NAME" \
            --notes "Unsigned build (beta). Check the files against SHA256SUMS; Windows SmartScreen shows a warning: More info → Run anyway."
